<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Algebra 2 Exhibition</title>
<meta name="theme-color" content="#0e1a2b">
<style>
:root{
  --ink:#0e1a2b;--ink2:#2a3547;--muted:#5d6778;--faint:#8a93a3;
  --paper:#f5f3ee;--card:#ffffff;--line:#e4e0d7;--line2:#d4cfc3;
  --value:#0f8a64;--value-soft:#e3f4ed;
  --debt:#e0523f;--debt-soft:#fde9e5;
  --water:#2563eb;--water-soft:rgba(37,99,235,.3);--water-deep:#123a8c;
  --gold:#c98a12;
  --r:18px;--r-sm:12px;
  --shadow:0 1px 0 rgba(14,26,43,.04),0 8px 24px -12px rgba(14,26,43,.18);
  --font:ui-sans-serif,-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Inter,Roboto,Helvetica,Arial,sans-serif;
  --display:ui-sans-serif,-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",Inter,Roboto,Helvetica,Arial,sans-serif;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--paper);color:var(--ink);font:16px/1.5 var(--font);font-variant-numeric:tabular-nums}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
a{color:var(--water-deep)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
:focus-visible{outline:3px solid var(--water);outline-offset:2px;border-radius:6px}

/* ---------- top bar ---------- */
.top{position:sticky;top:0;z-index:30;background:rgba(245,243,238,.92);backdrop-filter:saturate(1.4) blur(12px);-webkit-backdrop-filter:saturate(1.4) blur(12px);border-bottom:1px solid var(--line)}
.top-in{max-width:1080px;margin:0 auto;padding:10px 18px 0;display:flex;flex-direction:column;gap:8px}
.top-row{display:flex;align-items:center;justify-content:space-between;gap:12px}
.brand{display:flex;align-items:center;gap:9px;background:none;border:0;padding:0;font-weight:800;letter-spacing:-.02em;font-size:17px}
.brand svg{width:26px;height:26px}
.menu-btn{background:none;border:1px solid var(--line2);border-radius:999px;padding:6px 12px;font-size:14px;font-weight:600;color:var(--ink2)}
.rail{display:grid;grid-template-columns:repeat(6,1fr);gap:4px;padding-bottom:10px}
.rail button{all:unset;cursor:pointer;display:flex;flex-direction:column;gap:5px;font-size:11.5px;font-weight:600;color:var(--faint);text-align:left}
.rail button span{display:block;height:4px;border-radius:4px;background:var(--line2)}
.rail button.done span{background:var(--ink)}
.rail button.here span{background:var(--water)}
.rail button.here{color:var(--ink)}
.rail button.done{color:var(--ink2)}
.rail b{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
@media (max-width:560px){.rail b{font-size:0}.rail b::before{content:attr(data-n);font-size:11px}}

/* ---------- layout ---------- */
main{max-width:1080px;margin:0 auto;padding:22px 18px 140px}
.eyebrow{font-size:12.5px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--water)}
h1{font:800 clamp(30px,6vw,46px)/1.05 var(--display);letter-spacing:-.035em;margin:6px 0 10px}
h2{font:750 21px/1.2 var(--display);letter-spacing:-.02em;margin:0 0 4px}
h3{font:700 16px/1.3 var(--display);margin:0 0 4px}
.lede{font-size:17.5px;color:var(--ink2);max-width:640px;margin:0 0 22px}
.muted{color:var(--muted)}
.small{font-size:13.5px}
.grid2{display:grid;grid-template-columns:1fr;gap:16px}
@media (min-width:860px){.grid2{grid-template-columns:1.15fr .85fr;align-items:start}.sticky{position:sticky;top:120px}}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:18px;box-shadow:var(--shadow)}
.card+.card{margin-top:16px}
.card-head{display:flex;justify-content:space-between;align-items:baseline;gap:10px;margin-bottom:12px}
.stack>*+*{margin-top:16px}
.dark{background:var(--ink);color:#eef1f6;border-color:var(--ink)}
.dark .muted{color:#a9b3c4}

/* ---------- inputs ---------- */
label.f{display:block}
label.f>span{display:block;font-size:13px;font-weight:650;color:var(--ink2);margin-bottom:5px}
.inp{width:100%;border:1px solid var(--line2);background:#fff;border-radius:var(--r-sm);padding:11px 12px;font-size:16px;min-height:46px}
.inp:focus{border-color:var(--water);outline:none;box-shadow:0 0 0 3px var(--water-soft)}
.money-in{position:relative}.money-in .inp{padding-left:24px}.money-in::before{content:"$";position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--muted)}
.pct-in{position:relative}.pct-in .inp{padding-right:28px}.pct-in::after{content:"%";position:absolute;right:12px;top:50%;transform:translateY(-50%);color:var(--muted)}
textarea.inp{min-height:96px;resize:vertical;line-height:1.45}
.fields{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.seg{display:flex;flex-wrap:wrap;gap:6px}
.seg button{border:1px solid var(--line2);background:#fff;border-radius:999px;padding:8px 13px;font-size:14px;font-weight:600}
.seg button[aria-pressed=true]{background:var(--ink);color:#fff;border-color:var(--ink)}
input[type=range]{width:100%;accent-color:var(--water);height:28px}
.slider{display:grid;gap:2px}
.slider-top{display:flex;justify-content:space-between;align-items:baseline;font-size:14px;font-weight:650}
.slider-top output{font-size:17px;font-weight:800}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:0;border-radius:999px;padding:13px 20px;font-weight:700;font-size:15.5px;background:var(--ink);color:#fff;min-height:48px}
.btn.alt{background:#fff;color:var(--ink);border:1px solid var(--line2)}
.btn.blue{background:var(--water)}
.btn.sm{padding:8px 14px;min-height:38px;font-size:14px}
.link{background:none;border:0;padding:0;color:var(--water-deep);font-weight:650;text-decoration:underline;text-underline-offset:3px}
details summary{cursor:pointer;font-weight:650}

/* ---------- pick cards ---------- */
.picks{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
@media(min-width:860px){.picks{grid-template-columns:repeat(auto-fill,minmax(200px,1fr))}}
.pick b{font-size:14.5px!important}
.pick{all:unset;cursor:pointer;display:block;background:#fff;border:1.5px solid var(--line);border-radius:var(--r-sm);padding:14px;position:relative}
.pick:hover{border-color:var(--line2)}
.pick[aria-pressed=true]{border-color:var(--ink);box-shadow:0 0 0 1.5px var(--ink) inset}
.pick[aria-pressed=true]::after{content:"✓";position:absolute;top:10px;right:12px;width:22px;height:22px;border-radius:50%;background:var(--ink);color:#fff;font-size:13px;display:grid;place-items:center;font-weight:800}
.pick small{display:block;color:var(--muted);font-size:12.5px}
.pick b{display:block;font-size:15.5px;margin:2px 0;padding-right:24px}
.pick .amt{font-weight:800;font-size:15px}
.car-pick{padding:0;overflow:hidden}
.car-pick img{display:block;width:100%;aspect-ratio:16/10;object-fit:cover;background:#ddd}
.car-pick .cp{padding:11px 13px 13px}

/* ---------- numbers ---------- */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px}
.kpi{background:#fff;border:1px solid var(--line);border-radius:var(--r-sm);padding:12px 14px}
.kpi span{display:block;font-size:12.5px;font-weight:650;color:var(--muted)}
.kpi strong{display:block;font:800 22px/1.15 var(--display);letter-spacing:-.02em;margin-top:2px}
.kpi.good strong{color:var(--value)}.kpi.bad strong{color:var(--debt)}.kpi.wet strong{color:var(--water)}
.dark .kpi{background:rgba(255,255,255,.06);border-color:rgba(255,255,255,.1)}.dark .kpi span{color:#a9b3c4}
.ledger{width:100%;border-collapse:collapse;font-size:15px}
.ledger td{padding:7px 0;border-bottom:1px solid var(--line)}
.ledger td:last-child{text-align:right;font-weight:650}
.ledger tr.total td{border-bottom:0;border-top:2px solid var(--ink);font-weight:800;font-size:16.5px;padding-top:10px}
.ledger tr.sub td{color:var(--muted);font-size:13.5px}
.bar{height:12px;border-radius:12px;background:var(--line);overflow:hidden;display:flex}
.bar i{display:block;height:100%}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:13px;color:var(--muted);margin-top:8px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}
.verdict{border-radius:var(--r-sm);padding:13px 15px;font-weight:600;font-size:15px}
.verdict.good{background:var(--value-soft);color:#0a5a41}
.verdict.bad{background:var(--debt-soft);color:#9a2c1d}
.verdict.wet{background:#e6eefe;color:var(--water-deep)}
.verdict.info{background:#f0ede6;color:var(--ink2)}
.tbl{width:100%;border-collapse:collapse;font-size:14px}
.tbl th{font-size:12px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);text-align:right;padding:6px 8px;border-bottom:1px solid var(--line2)}
.tbl th:first-child,.tbl td:first-child{text-align:left}
.tbl td{padding:7px 8px;border-bottom:1px solid var(--line);text-align:right}
.tbl tr.under td{background:#eef3fe}
.tbl input{width:100%;min-width:64px;border:1px solid var(--line2);border-radius:8px;padding:7px 8px;font-size:15px;text-align:right;background:#fff}
.tbl td.x{width:34px;padding:0}
.x button{background:none;border:0;color:var(--faint);font-size:20px;line-height:1;padding:6px}
.scroll{overflow-x:auto;-webkit-overflow-scrolling:touch}

/* ---------- chart ---------- */
.chart{width:100%;height:auto;display:block;touch-action:pan-y}
.chart text{font:15px var(--font);fill:var(--muted)}
.chart .axis{stroke:var(--line2)}
.chart .grid{stroke:var(--line)}
.eq{font:700 20px/1.3 "Times New Roman",Georgia,serif;font-style:italic;letter-spacing:.01em}
.eq sup{font-size:.7em}
.eq .n{font-style:normal;font-family:var(--font);font-weight:800;font-size:.9em}

/* ---------- sticky dashboard ---------- */
.dock{position:fixed;left:0;right:0;bottom:0;z-index:25;padding:0 12px calc(10px + env(safe-area-inset-bottom))}
.dock-in{max-width:1080px;margin:0 auto;background:var(--ink);color:#fff;border-radius:20px;padding:10px 10px 10px 16px;display:flex;align-items:center;gap:12px;box-shadow:0 18px 40px -18px rgba(14,26,43,.6)}
.dock-stats{flex:1;display:flex;gap:16px;overflow:hidden}
.dock-stats div{min-width:0;flex:none}
.dock-stats span{display:block;font-size:11px;color:#a9b3c4;font-weight:600;white-space:nowrap}
.dock-stats b{display:block;font-size:16px;white-space:nowrap}
.dock .btn{background:#fff;color:var(--ink);padding:11px 16px;min-height:44px;white-space:nowrap}
.dock .back{background:none;border:0;color:#c8d0dc;font-weight:650;padding:8px;font-size:14px}
@media (max-width:480px){.dock-stats div:nth-child(3){display:none}.dock .back{display:none}.dock-stats{gap:12px}.dock-stats b{font-size:15px}.dock .btn{padding:10px 14px;font-size:14.5px}}

/* ---------- welcome ---------- */
.hero{display:grid;gap:22px;align-items:center;padding:10px 0 0}
@media(min-width:860px){.hero{grid-template-columns:1fr 1fr}}
.hero h1{font-size:clamp(40px,8vw,64px)}
.hero h1 em{font-style:normal;color:var(--water)}
.journey{display:grid;gap:8px;margin:18px 0 22px;padding:0;list-style:none;counter-reset:s}
.journey li{display:flex;gap:12px;align-items:baseline;font-size:15.5px}
.journey li::before{counter-increment:s;content:counter(s);flex:none;width:24px;height:24px;border-radius:50%;background:var(--ink);color:#fff;font-size:12.5px;font-weight:800;display:grid;place-items:center}
.journey b{font-weight:750}

/* ---------- modal ---------- */
.modal{position:fixed;inset:0;z-index:50;background:rgba(14,26,43,.5);display:grid;place-items:end center;padding:12px}
@media(min-width:640px){.modal{place-items:center}}
.sheet{background:var(--paper);border-radius:22px;max-width:520px;width:100%;padding:20px;max-height:90vh;overflow:auto}
.sheet .btn{width:100%;margin-top:8px}
.toast{position:fixed;left:50%;bottom:96px;transform:translateX(-50%) translateY(20px);opacity:0;background:var(--ink);color:#fff;padding:10px 16px;border-radius:999px;font-size:14px;font-weight:600;transition:.25s;z-index:60;pointer-events:none}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

/* ---------- exhibition board ---------- */
.board{background:#fff;border-radius:var(--r);border:1px solid var(--line);overflow:hidden;box-shadow:var(--shadow)}
.board-head{background:var(--ink);color:#fff;padding:22px}
.board-head h2{font-size:28px;color:#fff}
.board-body{padding:22px;display:grid;gap:18px}
@media(min-width:860px){.board-body{grid-template-columns:1fr 1fr}}
.board-car{display:flex;gap:14px;align-items:center}
.board-car img{width:120px;border-radius:12px;aspect-ratio:16/10;object-fit:cover}
.quote{font-size:17px;border-left:4px solid var(--water);padding-left:14px;white-space:pre-wrap}
@media print{
  .top,.dock,.no-print{display:none!important}
  body{background:#fff}
  main{padding:0;max-width:none}
  .board{border:0;box-shadow:none}
  .board-head{-webkit-print-color-adjust:exact;print-color-adjust:exact}
}

.rail{grid-template-columns:repeat(7,1fr)}
.qa{margin-top:14px}
.qa label>span{font-weight:650;font-size:14.5px;color:var(--ink);display:block;margin-bottom:6px}
.qa textarea.inp{min-height:84px}
.qgrid{display:grid;gap:12px;grid-template-columns:1fr}
@media(min-width:640px){.qgrid.two{grid-template-columns:1fr 1fr}}
.check{display:flex;gap:10px;align-items:end;flex-wrap:wrap}
.check label{flex:1;min-width:150px}
.explain{background:#f7f5f0;border:1px solid var(--line);border-radius:var(--r-sm);padding:14px;margin-top:12px}
.explain h3{margin-bottom:6px}
.score-dial{display:flex;align-items:center;gap:16px}
.score-num{font:800 46px/1 var(--display);letter-spacing:-.03em}
.factor{display:grid;grid-template-columns:1fr auto;gap:2px 10px;align-items:center;margin-top:10px}
.factor .bar{grid-column:1/-1;height:8px}
.opt h3{margin:16px 0 8px}
.report h2{margin-top:22px;padding-top:14px;border-top:2px solid var(--ink)}
.report .qa-item{margin:12px 0}
.report .qa-item b{display:block;font-size:14px}
.report .qa-item p{margin:4px 0 0;white-space:pre-wrap}
.report .blank{color:var(--debt);font-style:italic}
.hand input.ok{border-color:var(--value);background:var(--value-soft)}.hand input.no{border-color:var(--debt);background:var(--debt-soft)}
.hand td{vertical-align:middle}.hand td:first-child span{display:block}
.cp{border:2px solid var(--ink)}
.rubric{min-width:640px}.rubric td,.rubric th{text-align:left;vertical-align:top}.rubric th:last-child{white-space:nowrap}
@media print{.rubric{min-width:0;font-size:11px}}
.grid2>*{min-width:0}
.credit-line{font-size:12px;color:var(--faint);margin-top:10px}
</style>
</head>

<div id="app"></div>
<div id="toast" class="toast" role="status" aria-live="polite"></div>
<input id="import" type="file" accept=".json,application/json" hidden>

/* ---- math ---- */
function payment(P,apr,n){if(!(P>0))return 0;const r=apr/1200;return r===0?P/n:P*r/(1-(1+r)**-n);}
function balanceAt(P,apr,n,m){if(!(P>0)||m>=n)return 0;const r=apr/1200,p=payment(P,apr,n);return r===0?P-p*m:P*(1+r)**m-p*((1+r)**m-1)/r;}
function jobSalary(j){return j.salary??Math.round(j.rate*j.hours*j.weeks);}
function expFit(pts){
 const ok=pts.filter(p=>p.v>0);if(ok.length<2)return null;
 const n=ok.length,mx=ok.reduce((s,p)=>s+p.t,0)/n,my=ok.reduce((s,p)=>s+Math.log(p.v),0)/n;
 const sxx=ok.reduce((s,p)=>s+(p.t-mx)**2,0);if(!sxx)return null;
 const k=ok.reduce((s,p)=>s+(p.t-mx)*(Math.log(p.v)-my),0)/sxx;
 return{a:Math.exp(my-k*mx),b:Math.exp(k)};
}
// same regression Desmos runs for y1 ~ a*b^x1: least squares on the prices themselves
function expFitLS(pts){
 const ok=pts.filter(p=>p.v>0),start=expFit(ok);if(!start)return null;
 const at=b=>{let n=0,d=0;for(const p of ok){const w=b**p.t;n+=p.v*w;d+=w*w;}const a=n/d;return{a,b,e:ok.reduce((s,p)=>s+(p.v-a*b**p.t)**2,0)};};
 let lo=start.b*.75,hi=start.b*1.25;const g=(Math.sqrt(5)-1)/2;
 for(let i=0;i<90;i++){const x=hi-g*(hi-lo),y=lo+g*(hi-lo);if(at(x).e<at(y).e)hi=y;else lo=x;}

  <button class="btn sm alt" data-act="copybal">Copy loan balances</button>
  <div class="form2" style="display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:12px">${box('quad.a','quad','p from Desmos')}${box('quad.b','quad','q from Desmos')}</div>
  <div data-live="quadscore" style="margin-top:12px"></div>
 </section>
 <section class="card"><h2>3. Solve for the crossing</h2>
  <div data-live="crossgate"></div>
  <div id="crossbody" hidden><p style="margin:6px 0 10px">Where does V(t) = D(t)? In Desmos, graph ${code('y = a*b^x')} and ${code(`y = p*x^2 + q*x + ${c.financed.toFixed(2)}`)}, then click the point where they cross. Desmos gives x in <b>years</b>. Your answer is in <b>months</b>.</p>

}
function stressCard(){
 const x=S.stress,sc=stressCalc(),P=x.price;
 const box=(k,l)=>`<label class="f"><span>${l}</span><input class="inp" inputmode="text" autocomplete="off" data-k="stress.quad.${k}" data-num value="${x.quad[k]??''}"></label>`;
 const code=t=>`<code style="background:#f0ede6;border-radius:6px;padding:2px 7px">${t}</code>`;
 return `<section class="card" id="stress" hidden><h2>4. Break it</h2>
 <p style="margin:6px 0 10px"><span data-live="stressWhy"></span> Plenty of drivers aren’t that lucky. Keep the same car and the same V(t). Build a loan that would put you underwater for <b>at least a year</b>, then find out exactly how long.</p>
 <div class="slider"><div class="slider-top"><span>Down payment</span><output data-live="sDown"></output></div><input type="range" aria-label="Down payment" min="0" max="${Math.round(P*.5/100)*100}" step="100" data-k="stress.down" data-num value="${x.down}"></div>
 <h3 style="margin:14px 0 8px">Length of the loan</h3><div class="seg">${[36,48,60,72,84].map(n=>`<button data-sterm="${n}" aria-pressed="${x.term===n}">${n} mo</button>`).join('')}</div>
 <h3 style="margin:14px 0 8px">Credit</h3><div class="seg">${TIERS.map(t=>`<button data-sovr="${t.id}" aria-pressed="${sc.tier===t}">${t.label} · ${t.apr}%</button>`).join('')}</div>

 <div class="slider" style="margin-top:14px"><div class="slider-top"><span>Debt left from an old car, added to this loan</span><output data-live="sOld"></output></div><input type="range" aria-label="Debt from an old car" min="0" max="${Math.round(P*.6/100)*100}" step="100" data-k="stress.old" data-num value="${x.old}"></div>

  <button class="btn sm alt" data-act="copybals">Copy new balances</button>
  <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:12px">${box('a','p from Desmos')}${box('b','q from Desmos')}</div>
  <div data-live="squad" style="margin-top:12px"></div>
  <div id="scrossrow" hidden style="margin-top:14px">${checkRow('scross','In which month would you get above water for good with this loan?','none')}</div>
 </div>
 <div data-live="schart" style="margin-top:14px"></div>
 ${qa('broke','What broke? Which change put you underwater the most, and why does that make sense with your two graphs?')}</section>`;
}
function stressLive(c){
 const el=$('#stress');if(!el)return;el.hidden=!barely(c);if(el.hidden)return;
 const x=S.stress,sc=stressCalc(),w=S.solved.wet??c.wetMonths,ok=stressOk(sc),far=sc.wetMonths>=STRESS_MIN;
 put('stressWhy',w?`Your plan is only underwater for ${w} month${w>1?'s':''}.`:'Your plan is never underwater.');
 put('sDown',money(x.down));put('sOld',money(x.old));
 put('stressState',`<div class="kpis" style="margin-bottom:10px"><div class="kpi"><span>Amount borrowed</span><strong>${money(sc.financed)}</strong></div><div class="kpi"><span>Payment</span><strong>${money(sc.pay)}</strong></div><div class="kpi bad"><span>Total interest</span><strong>${money(sc.interest)}</strong></div></div><div class="verdict ${far?'wet':'info'}">${far?'This loan puts you underwater for at least a year. Now find out exactly how long.':sc.wetMonths?'Underwater, but for less than a year. Push further.':'Still above water the whole time. What makes the balance start higher, or fall more slowly?'}</div>`);
 $('#stressbody').hidden=!far;
 put('sCmd',`<code style="background:#f0ede6;border-radius:6px;padding:2px 7px">y1 ~ p*x1^2 + q*x1 + ${sc.financed.toFixed(2)}</code>`);
 const typed=num(x.quad.a)!=null&&num(x.quad.b)!=null;
 put('squad',!typed?'':sc.quadPass?`<div class="verdict good"><b>Matches the regression</b> · biggest miss ${money(sc.quadMiss.e)}</div>`:`<div class="verdict info"><b>Not matched yet</b> · biggest miss ${money(sc.quadMiss.e)} at year ${sc.quadMiss.t}. Goal: ${money(sc.quadGoal)} or less.</div>`);
 $('#scrossrow').hidden=!sc.quadPass;
 put('schart',ok?`${crossChart(sc)}${crossLegend}<div style="margin-top:10px">${wetVerdict(sc)}</div>`:'');
}
function stressSummary(){const x=S.stress,v=x.solved;return v?`${money(v.c)} at ${v.apr}% for ${v.term} months${x.down?`, ${money(x.down)} down`:', nothing down'}${x.old?`, including ${money(x.old)} from an old car`:''}`:'';}
function fitScore(c){
 if(c.fitR2==null)return '';
 const s=c.fitR2.toFixed(3);
 if(c.fitPass)return `<div class="verdict good"><b>Matches the regression</b> · R² = ${s}${c.bestR2<.8?'<br><span class="small">Your listings are scattered. Check for different trims, unusual mileage or salvage titles.</span>':''}</div>`;
 return `<div class="verdict info"><b>${S.fit.tried?'Not matched yet':'Starting guess'}</b> · R² = ${s}. <span class="small">The regression on your listings reaches ${c.bestR2.toFixed(3)}. A curve that looks close can still be wrong about when you’re underwater.</span></div>`;
}
function quadChart(c){
 const xmax=c.n/12,ymax=niceMax(c.financed*1.08),pts=[];for(let i=0;i<=120;i++){const t=xmax*i/120;pts.push([t,Math.max(-1e9,c.D(t))]);}
 return chart({xmax,ymax,series:[{pts,color:'var(--water)'}],dots:c.balPts.map(p=>({t:p.t,v:p.v,color:'var(--debt)',square:true})),h:300});

 return `<div class="verdict info"><b>${S.quad.tried?'Not matched yet':'Starting guess'}</b> · ${miss}. <span class="small">Goal: ${money(c.quadGoal)} or less. A straight line can score R² near 0.98 here and still miss by hundreds of dollars.</span></div>`;
}
function crossOpen(c){return c.solved||(c.fitPass&&c.quadPass&&chkOk('vpt',c));}
function crossGate(c){
 if(c.solved)return '';
 if(S.solved&&S.solved.key!==c.key)return '<div class="verdict info" style="margin-bottom:12px">Your value model changed, so solve for the crossing again.</div>';
 if(crossOpen(c))return '';
 const row=(ok,t)=>`<p style="margin:6px 0">${ok?'✓':'○'} ${t}</p>`;
 return `<p class="muted" style="margin:4px 0">Finish these to unlock this.</p>${row(c.fitPass,'Exponential value model')}${row(chkOk('vpt',c),'V(3) by hand')}${row(c.quadPass,'Quadratic loan model')}`;
}
function crossLocked(){return '<div class="verdict info">Your graph appears here after you match both regressions, find V(3) and solve for the crossing.</div>';}
function solvedLine(){const v=S.solved;if(!v)return '';return `<p class="eq" style="margin:6px 0">D(t) = <span class="n">${v.p.toFixed(1)}</span>t² ${v.q<0?'−':'+'} <span class="n">${Math.abs(v.q).toFixed(1)}</span>t + <span class="n">${Math.round(v.c)}</span> <span class="small muted" style="font-style:normal;font-family:var(--font)">loan · ${v.term} mo at ${v.apr}% · R² = ${v.r2?.toFixed(4)??'—'}</span></p>`;}
function wetKpis(c){

}

/* ---- 7. decide ---- */

 const c=calc(),L=S.loan;
 if(!c.solved)return needs('Finish your model first','Match both regressions and solve for the crossing point. Your decision is based on that graph.','model');
 return `${cpBanner('model')}${barely(c)&&!stressOk()?'<div class="verdict info no-print" style="margin-bottom:14px">Part 4 of step 6 isn’t finished: find a loan that would put you underwater. <button class="link" data-go="model">Go back to it</button></div>':''}<p class="eyebrow">Step 7 of 7 · Decide</p><h1>Fix it &amp; defend it</h1>

function put(k,html){document.querySelectorAll(`[data-live="${k}"]`).forEach(el=>{if(el.innerHTML!==html)el.innerHTML=html;});}
const CHECKS={
 monthly:{want:()=>CARD_APR/12,tol:.01,good:()=>`Right: 24% ÷ 12 months = 2% a month.`,hint:g=>Math.abs(g-24)<.01?'That’s the yearly rate. How many months are in a year?':Math.abs(g-.02)<.001?'Close. Write it as a percent, not a decimal.':'Divide the yearly rate by the number of months in a year.'},
 interest:{want:()=>50,tol:.01,good:()=>`Right: $2,500 × 0.02 = $50.00 in one month. That’s $600 a year if you never pay it down.`,hint:g=>Math.abs(g-600)<1?'That’s a whole year of interest. Just one month.':Math.abs(g-2550)<1?'That’s the new balance. How much of it is interest?':'Multiply the balance by the monthly rate as a decimal (2% = 0.02).'},
 double:{want:()=>35,tol:1,good:()=>`Right: 1.02³⁵ ≈ 2.00, so in about 35 months (about 3 years) $2,500 becomes $5,000.`,hint:g=>g<35?`Not yet. 1.02^${Math.round(g)} = ${(1.02**g).toFixed(2)}. Keep going until it reaches 2.`:`Too far. 1.02^${Math.round(g)} = ${(1.02**g).toFixed(2)}. Find when it first reaches 2.`},
 tanks:{want:c=>c.tanks,tol:.1,good:c=>`Right: ${S.cc.miles} ÷ ${c.mpg} = ${c.gallons.toFixed(1)} gallons, ÷ ${c.tank} gal per tank = ${c.tanks.toFixed(1)} tanks.`,hint:(g,c)=>c.tank>0?`First find gallons: miles ÷ MPG. Then divide by the tank size (${c.tank} gal).`:'Enter your tank size in the listing first.'},
 vpt:{want:c=>c.V(3),tol:c=>Math.max(3,.0025*c.V(3)),good:c=>`Right: V(3) = ${money(c.a)}(${(+c.b).toFixed(4)})³ ≈ ${money(c.V(3))}.`,hint:(g,c)=>Math.abs(g-c.a*c.b*3)<c.a*.004?'That’s a · b · 3. The 3 is an exponent: b × b × b.':Math.abs(g-(c.a*c.b)**3)<(c.a*c.b)**3*.01?'Only b is raised to the 3rd power. Do b³ first, then multiply by a.':Math.abs(g-c.V(2))<c.V(2)*.004?'That’s V(2). Multiply by b one more time.':Math.abs(g-c.a*(1-3*(1-c.b)))<c.a*.004?'You took off the same dollar amount each year. It’s a percent of what’s left, so multiply by b three times.':'Find b³ first, then multiply by a.'},
 scross:{tol:1,want:()=>{const r=crossRange(stressCalc()),v=num(S.chk.scross);return r==null?null:Math.min(r[1],Math.max(r[0],v??r[0]));},good:()=>{const sc=stressCalc();return `Yes. The models cross about ${(modelCross(sc)/12).toFixed(2)} years in, and the bank’s exact schedule says month ${sc.dryAt}.`;},hint:g=>CHECKS.cross.hint(g,stressCalc())},
 cross:{tol:1,want:c=>{const r=crossRange(c),v=num(S.chk.cross);return r==null?null:Math.min(r[1],Math.max(r[0],v??r[0]));},
  good:c=>c.dryAt?`Yes. The models cross about ${(modelCross(c)/12).toFixed(2)} years in, and the bank’s exact schedule says month ${c.dryAt}.`:'Yes. The car is always worth more than you owe.',
  hint:(g,c)=>{if(g<0||g>c.n)return `The loan lasts ${c.n} months. Pick a month from 0 to ${c.n}.`;const V=c.V(g/12),D=c.D(g/12);return `At month ${g}, V = ${money(V)} and D = ${money(D)}. ${D>V?'You’d still be underwater, so the last crossing is later.':'You’re above water there. Did you find the first month you stay that way? Remember: months = years × 12.'}`;}},
 lose:{want:c=>(1-c.b)*100,tol:.15,good:c=>`Yes. Keeping ${(+c.b).toFixed(3)} means losing ${((1-c.b)*100).toFixed(1)}% a year.`,hint:(g,c)=>Math.abs(g-c.b*100)<.2?'That’s the percent it keeps. How much does it lose?':'If it keeps b of its value, the fraction lost is 1 − b.'}
};

}

/* ---- events ---- */
function setPath(path,val){const k=path.split('.');let o=S;for(let i=0;i<k.length-1;i++)o=o[k[i]];o[k.at(-1)]=val;}
app.addEventListener('input',e=>{
 const t=e.target;
 if(t.dataset.k){setPath(t.dataset.k,'num' in t.dataset?(t.value===''?null:num(t.value)):t.value);if(t.dataset.fit){S[t.dataset.fit].tried=true;document.querySelectorAll(`[data-k="${t.dataset.k}"]`).forEach(el=>{if(el!==t)el.value=num(t.value)??'';});}save();live();return;}
 if(t.dataset.row!=null){S.data[+t.dataset.row][t.dataset.f]=t.value;if(S.dataSource==='practice')S.dataSource='edited';save();live();return;}
 if(t.dataset.chk){S.chk[t.dataset.chk]=t.value;S.chk[t.dataset.chk+'Tried']=false;if('hand' in t.dataset)S.chk.handTried=false;save();}
});
app.addEventListener('keydown',e=>{if(e.key==='Enter'&&'hand' in e.target.dataset){e.preventDefault();app.querySelector('[data-act=checkhand]')?.click();}
 else if(e.key==='Enter'&&e.target.id?.startsWith('init-')){e.preventDefault();app.querySelector(`[data-act=sign][data-id="${e.target.id.slice(5)}"]`)?.click();}
 else if(e.key==='Enter'&&e.target.dataset.chk){e.preventDefault();app.querySelector(`[data-act=check][data-id="${e.target.dataset.chk}"]`)?.click();}});
app.addEventListener('click',async e=>{
 const b=e.target.closest('button');if(!b)return;const d=b.dataset;
 if(d.go){go(d.go);return;}
 if(d.quiz!=null){const z=S.quiz;z.a[QUIZ[z.i][0]]=+d.quiz;if(z.i<QUIZ.length-1)z.i++;else{const was=intro();z.done=true;z.b=quizBudget().b;Object.assign(S.b,z.b);if(was)S.step='welcome';}save();render();scrollTo({top:0,behavior:'instant'});$('#main')?.focus({preventScroll:true});return;}
 if(d.job){if(d.job==='own'){if(S.job.id!=='own')S.job={id:'own',title:'',salary:null,url:''};}else{const j=JOBS.find(x=>x.id===d.job);S.job={id:j.id,title:j.title,salary:jobSalary(j),url:j.url};}save();render();return;}
 if(d.home){const r=RENTALS.find(x=>x.id===d.home);S.home={...S.home,id:r.id,total:r.total,url:r.url};save();render();return;}
 if(d.split){S.home.split=d.split;save();render();return;}
 if(d.cr){S.credit[d.cr]=d.v;save();render();return;}
 if(d.car){if(d.car===S.car.id)return;if((S.data.length||S.hand.done||S.cp.loan)&&!await ask('Switch cars? Your loan work, listings, models and sign-offs for checkpoints 2 and 3 will be erased.','Switch cars'))return;
  S.hand=fresh().hand;S.stress=fresh().stress;delete S.cp.loan;delete S.cp.model;S.chk.handTried=false;for(const k of ['firstInt','p1','b1','i2','p2','b2','vpt','scross']){delete S.chk[k];delete S.chk[k+'Tried'];delete S.chk[k+'Ok'];}
  if(d.car==='own'){S.car={id:'own',name:'',year:null,price:null,mpg:null,tank:null,url:''};}else{const g=GARAGE.find(x=>x.id===d.car);S.car={id:g.id,name:g.name,year:g.year,price:g.price,mpg:g.mpg,tank:g.tank,url:''};}S.data=[];S.dataSource='';S.fit={a:null,b:.85,tried:false,shown:false};S.quad={a:null,b:null,tried:false,shown:false};S.solved=null;S.base=null;for(const k of ['tanks','cross','lose']){S.chk[k+'Tried']=false;S.chk[k+'Ok']=false;}save();render();return;}
 if(d.term){S.loan.term=+d.term;S.quad={a:null,b:null,tried:false,shown:false};save();render();return;}
 if(d.sterm){S.stress.term=+d.sterm;S.stress.quad={a:null,b:null};save();render();return;}
 if(d.sovr){S.stress.ovr=d.sovr;save();render();return;}
 if(d.sroll){S.stress.roll=d.sroll==='1';save();render();return;}
 if(d.ovr!=null){S.loan.override=d.ovr||null;save();render();return;}
 if(d.roll){S.loan.roll=d.roll==='1';save();render();return;}
 if(d.choice){S.decision.choice=d.choice;save();render();return;}
 if(d.del!=null){S.data.splice(+d.del,1);save();render();return;}
 const a=d.act;
 if(a==='check'){const id=d.id,c=calc(),v=num(S.chk[id]),w=CHECKS[id].want(c);S.chk[id+'Tried']=true;S.chk[id+'Ok']=v!=null&&w!=null&&Math.abs(v-w)<=tolOf(CHECKS[id],c);if(id==='cross'&&S.chk.crossOk&&c.fitPass&&c.quadPass&&chkOk('vpt',c)){S.solved={key:c.key,wet:c.wetMonths,month:v,p:c.qa,q:c.qb,c:c.financed,r2:c.quadR2,term:c.n,apr:c.apr};rebase();}
  if(id==='scross'&&S.chk.scrossOk){const sc=stressCalc();if(sc.quadPass&&sc.wetMonths>=STRESS_MIN)S.stress.solved={key:stressKey(sc),month:v,p:sc.qa,q:sc.qb,c:sc.financed,term:sc.n,apr:sc.apr,wet:sc.wetMonths,r2:sc.quadR2};}
  save();live();const rail=app.querySelector('.rail');if(rail){const tmp=document.createElement('div');tmp.innerHTML=topBar();rail.replaceWith(tmp.querySelector('.rail'));}return;}
 if(a==='checkhand'){const c=calc(),w=handWant(c);S.chk.handTried=true;S.hand.tries++;const ok=HAND.every(([id])=>handOk(id,w));if(ok)S.hand={...S.hand,done:true,rows:w};save();if(ok){render();toast('Both months are correct');}else live();return;}
 if(a==='sign'){const by=($('#init-'+d.id)?.value||'').trim();if(by.length<2){toast('Type your initials first');return;}const c=calc(),k=CHECKPOINTS[d.id];S.cp[d.id]={by,at:new Date().toLocaleDateString('en-US',{month:'short',day:'numeric'}),left:k.items(c).filter(x=>!x[1]).length,snap:k.snap(c)};save();render();toast('Checkpoint signed');return;}
 if(a==='unsign'){if(await ask('Remove this sign-off?','Remove')){delete S.cp[d.id];save();render();}return;}
 if(a==='backup'){exportBackup();return;}
 if(a==='copybals'){await copyText(stressCalc().balPts.map(p=>p.t+'\t'+p.v.toFixed(2)).join('\n'));return;}
 if(a==='quizback'){S.quiz.i=Math.max(0,S.quiz.i-1);save();render();$('#main')?.focus({preventScroll:true});return;}
 if(a==='addrow'){S.data.push({year:'',price:'',miles:''});save();render();document.querySelector('#datatable tbody tr:last-child input')?.focus();return;}
 if(a==='clearrows'){if(await ask('Remove all your listings?','Remove all')){S.data=[];S.dataSource='';save();render();}return;}
 if(a==='practice'){S.data=practiceData();S.dataSource='practice';save();render();toast('Practice data loaded');return;}
 if(a==='copyval'||a==='copybal'){const c=calc(),rows=a==='copyval'?c.pts.slice().sort((x,y)=>x.t-y.t).map(p=>p.t+'\t'+p.v):c.balPts.map(p=>p.t+'\t'+p.v.toFixed(2));await copyText(rows.join('\n'));return;}
 if(a==='reset-plan'){const b=S.base;if(b){S.car.price=b.price;S.loan.down=b.down;S.loan.term=b.term;S.loan.override=b.override||null;S.loan.roll=b.roll;save();render();}return;}
 if(a==='print'){try{print();}catch{}toast('If nothing opened, press Ctrl+P / ⌘P');return;}
 if(a==='menu'){menu();return;}
 if(a==='example'){if((S.job.title||S.car.name)&&!await ask('Load the worked example? It replaces your current project. Download a backup first if you need it.','Load example'))return;S=example();save();go('paycheck');toast('Worked example loaded');return;}
});
function exportBackup(){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(S,null,1)],{type:'application/json'}));a.download=`${intro()?'exhibition':'life-and-car'}-${(S.name||'project').replace(/\W+/g,'-').toLowerCase()}.json`;a.click();toast('Backup downloaded');}
async function copyText(text){
 try{await navigator.clipboard.writeText(text);toast('Copied. Paste into a blank line in Desmos.');}
 catch{const m=document.createElement('div');m.className='modal';m.innerHTML=`<div class="sheet" role="dialog" aria-modal="true" aria-label="Copy data"><p style="font-weight:600">Copying was blocked. Select this and copy it.</p><textarea class="inp" rows="10" readonly>${esc(text)}</textarea><button class="btn" data-x>Close</button></div>`;document.body.appendChild(m);m.querySelector('textarea').select();m.addEventListener('click',e=>{if(e.target===m||e.target.closest('[data-x]'))m.remove();});}
}
function practiceData(car=S.car,fixed=false){
 const g=GARAGE.find(x=>x.id===car.id),Y=g.year,P=g.price;
 const offs=[-2,-1,1,2,3,4,5,6,8],noise=[.04,-.03,.05,-.06,.02,.07,-.04,.03,-.05].map(n=>fixed?n:Math.random()*.14-.07); // each student gets a different practice set
 return offs.map((t,i)=>{const yr=Y-t,v=P*g.keep**t*(1+noise[i]);return{year:String(yr),price:String(Math.round(v/50)*50),miles:String(Math.max(3000,Math.round(((2026-yr)*11800+noise[i]*40000)/100)*100))};});
}
function example(){const s=fresh(),j=JOBS[0],g=GARAGE.find(x=>x.id==='niro'),r=RENTALS[1];
 s.name='Worked example';s.job={id:j.id,title:j.title,salary:jobSalary(j),url:j.url};s.home={id:r.id,total:r.total,split:'2',custom:null,url:r.url};
 s.quiz.a={lunch:3,sat:1,drink:3,clothes:3,dash:3,room:0,games:3,look:1,dinner:0,subs:0,phone:2,lost:0,hot:3,shower:3,gift:3};s.quiz.done=true;s.quiz.b=quizBudget(s.quiz.a).b;Object.assign(s.b,s.quiz.b);
 s.car={id:g.id,name:g.name,year:g.year,price:g.price,mpg:g.mpg,tank:g.tank,url:''};s.data=practiceData(s.car,true);s.dataSource='practice';s.step='paycheck';
 const fit=calc(s).best;s.fit={a:Math.round(fit.a),b:Math.round(fit.b*1e4)/1e4,tried:true,shown:false};
 const q=calc(s).qbest;s.quad={a:Math.round(q.a*10)/10,b:Math.round(q.b*10)/10,tried:true,shown:false};
 const c=calc(s);s.solved={key:c.key,month:c.dryAt,p:c.qa,q:c.qb,c:c.financed,r2:c.quadR2,term:c.n,apr:c.apr};s.solved.wet=c.wetMonths;s.hand={done:true,tries:1,rows:handWant(c)};s.chk={cross:String(c.dryAt),crossTried:true,crossOk:true,vpt:String(Math.round(c.V(3))),vptTried:true,vptOk:true};return s;}
function menu(){
 const m=document.createElement('div');m.className='modal';m.innerHTML=`<div class="sheet" role="dialog" aria-modal="true" aria-label="Project menu"><h2>Your project</h2><p class="small muted">${saveFailed?'This browser isn’t saving. Download a backup now.':'Saved in this browser.'}</p>
 <label class="f" style="margin:10px 0"><span>Your name (for the report and board)</span><input class="inp" id="nm" value="${esc(S.name)}"></label>
 ${intro()?'':'<button class="btn" data-m="report">My report (for grading)</button><button class="btn alt" data-m="board">Exhibition board</button><button class="btn alt" data-m="rubric">How you’re graded</button>'}<button class="btn alt" data-m="export">Download backup (.json)</button><button class="btn alt" data-m="import">Open a backup file</button><button class="btn alt" data-m="copy">Copy backup as text</button><button class="btn alt" data-m="paste">Paste a backup</button><div id="pastebox" hidden><textarea class="inp" placeholder="Paste backup text here"></textarea><button class="btn" data-m="load">Open pasted backup</button></div><button class="btn alt" data-m="new" style="color:var(--debt)">Start a new project</button><button class="btn alt" data-m="close">Close</button></div>`;
 document.body.appendChild(m);
 m.querySelector('#nm').addEventListener('input',e=>{S.name=e.target.value;save();});
 m.addEventListener('click',async e=>{const b=e.target.closest('[data-m]');if(e.target===m||b?.dataset.m==='close'){m.remove();render();return;}if(!b)return;const k=b.dataset.m;
  if(k==='report'||k==='board'||k==='rubric'){m.remove();go(k);}
  if(k==='export')exportBackup();
  if(k==='import')$('#import').click();
  if(k==='copy'){try{await navigator.clipboard.writeText(JSON.stringify(S));toast('Backup copied. Paste it into a note or doc.');}catch{toast('Copy was blocked here. Use Download backup.');}}
  if(k==='paste'){const box=m.querySelector('#pastebox');box.hidden=!box.hidden;if(!box.hidden)box.querySelector('textarea').focus();}
  if(k==='load'){try{const d=JSON.parse(m.querySelector('#pastebox textarea').value);if(!(d.v>=3))throw 0;S=merge(d);save();m.remove();render();toast('Backup opened');}catch{toast('That text isn’t a project backup');}}
  if(k==='new'){m.remove();if(await ask('Start over? Your current work in this browser will be erased.','Start over')){S=fresh();save();go('welcome');}}
 });
}
$('#import').addEventListener('change',async e=>{const f=e.target.files[0];if(!f)return;try{const d=JSON.parse(await f.text());if(!(d.v>=3))throw 0;S=merge(d);save();document.querySelector('.modal')?.remove();render();toast('Backup opened');}catch{toast('That file isn’t a project backup');}e.target.value='';});
render();
</script>
</body>
