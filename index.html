// Search file titles for the vehicle itself, with a stricter first pass for the model year.
function carQuery(name) {
  const words=String(name||'').toLowerCase().match(/[a-z0-9]+/g)||[];
  const year=words.find(w=>/^(19|20)\d{2}$/.test(w));
  const tokens=words.filter(w=>w!==year);
  return {year,tokens,model:tokens.join(' '),key:'car:'+words.join(' ')};
}
function commonsURL(value,host) {
  try {const u=new URL(value);return u.protocol==='https:'&&u.hostname===host&&!u.username&&!u.password&&u.port==='';}catch{return false;}
}
function approvedImage(p){
  return !!p&&(commonsURL(p.url,'upload.wikimedia.org')||commonsURL(p.url,'thumb.wikimedia.org'))&&commonsURL(p.source,'commons.wikimedia.org')&&
    ['title','author','license'].every(k=>typeof p[k]==='string'&&p[k].length>0&&p[k].length<=500);
}
function metadataText(raw) {
  return String(raw||'').replace(/<[^>]*>/g,' ').replace(/&amp;/g,'&').replace(/&quot;/g,'"').replace(/&#39;|&apos;/g,"'").replace(/&nbsp;/g,' ').replace(/\s+/g,' ').trim().slice(0,500);
}
function selectImage(pages,query,requireYear) {
  const options=[];
  for(const page of pages||[]){
    const title=String(page.title||'').replace(/^File:/,'');
    const flat=' '+(title.toLowerCase().match(/[a-z0-9]+/g)||[]).join(' ')+' ';
    if(!/\.(jpe?g|webp|png)$/i.test(title)||/\b(interior|dashboard|wheel|engine|emblem|badge|logo|poster|brochure|crash|replica|toy|diecast|headlight|taillight|steering|police wreck)\b/i.test(flat))continue;
    if(!query.tokens.every(t=>flat.includes(' '+t+' ')))continue;
    const sameYear=!!query.year&&flat.includes(' '+query.year+' ');
    if(requireYear&&!sameYear)continue;
    const info=page.imageinfo?.[0],meta=info?.extmetadata;
    if(!info||!meta)continue;
    const license=metadataText(meta.LicenseShortName?.value);
    if(!/^(CC (BY(?:-SA)? [1-4]\.0|BY(?:-SA)? 2\.5)|CC0( 1\.0)?|Public domain)$/i.test(license))continue;
    const author=metadataText(meta.Attribution?.value||meta.Artist?.value);
    const result={url:info.thumburl,source:info.descriptionurl,title,author,license,yearMatch:sameYear};
    if(!approvedImage(result))continue;
    const score=(sameYear?50:0)+(/\b(front|side)\b/.test(flat)?5:0)-(Number(page.index)||0)/100;
    options.push({score,result});
  }
  return options.sort((a,b)=>b.score-a.score)[0]?.result||null;
}
async function findCarImage(name,fetcher,signal) {
  const query=carQuery(name);if(query.tokens.length<2||String(name).length>100)return null;
  for(const yearPass of (query.year?[true,false]:[false])){
    const api=new URL('https://commons.wikimedia.org/w/api.php');
    const search=(yearPass?query.year+' ':'')+query.model+' filetype:bitmap';
    const params={action:'query',format:'json',formatversion:'2',origin:'*',generator:'search',gsrnamespace:'6',gsrlimit:'10',gsrsearch:search,prop:'imageinfo',iiprop:'url|extmetadata',iiurlwidth:'640',iiextmetadatafilter:'Artist|Attribution|LicenseShortName'};
    for(const [k,v] of Object.entries(params))api.searchParams.set(k,v);
    const response=await fetcher(api.href,{signal,credentials:'omit',referrerPolicy:'no-referrer'});
    if(!response.ok)throw Error('Photo provider is unavailable.');
    const data=await response.json();if(data.error)throw Error('Photo provider is unavailable.');
    const found=selectImage(data.query?.pages,query,yearPass);

}

    const scale=Math.min(1,900/Math.max(img.width,img.height));
    const canvas=document.createElement('canvas');canvas.width=Math.max(1,Math.round(img.width*scale));canvas.height=Math.max(1,Math.round(img.height*scale));
    const ctx=canvas.getContext('2d');ctx.fillStyle='#fff';ctx.fillRect(0,0,canvas.width,canvas.height);ctx.drawImage(img,0,0,canvas.width,canvas.height);
    let photo=canvas.toDataURL('image/jpeg',.76);

    if(!validPhoto(photo))throw Error('Try a smaller or cropped photo.');
    if((slot==='dream'?state.firstDraft:state.cars[slot])!==target)return;

 if(action==='reset')modal(`<h2 id="modal-title">Start a new project?</h2><p>This clears the project saved in this browser. Download your current work first if you want to keep it.</p><div class="inline row-spaced"><button class="btn secondary" data-action="export">Download current work</button><button class="btn" data-action="confirm-reset">Start fresh</button></div>`);
 if(action==='confirm-reset'){state=fresh();photoJobs.clear();resetJobSearch();feedback={};save();closeModal();go('welcome');}
 if(action==='close')closeModal();if(action==='export')exportWork();if(action==='import'){if(state.savedAt)modal(`<h2 id="modal-title">Open a saved project</h2><p>The selected backup will replace the work saved in this browser. Download your current work first to keep it.</p><div class="inline row-spaced"><button class="btn secondary" data-action="export">Download current work</button><button class="btn" data-action="choose-import">Choose backup file</button></div>`);else document.querySelector('#import-file').click();}
 if(action==='choose-import'){closeModal();document.querySelector('#import-file').click();}
 if(action==='print'){if(page!=='report')go('report');else render();requestAnimationFrame(()=>window.print());}
 if(action==='baseline'){const c=calculate(state);if(!c.ready)return;state.baseline={car:state.cars[state.selected].name,remainder:c.remainder,cashLeft:c.cashLeft,term:state.term,capturedAt:new Date().toISOString()};save();render();notify('Comparison saved. Change a choice, then return here.');}
 if(action==='check-payment')gradePayment();

});
document.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target?.dataset?.calculator!==undefined){e.preventDefault();calcKey('=');return;}if(e.key==='Escape')closeModal();const modal=document.querySelector('.modal');if(e.key==='Tab'&&modal){const items=[...modal.querySelectorAll('button,a,input,textarea')],first=items[0],last=items.at(-1);if(e.shiftKey&&document.activeElement===first){e.preventDefault();last.focus();}else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first.focus();}}});
document.querySelector('#import-file').addEventListener('change',async e=>{const file=e.target.files[0];if(!file)return;try{if(file.size>2e6)throw Error('Choose a project backup smaller than 2 MB.');const next=restore(JSON.parse(await file.text()));state=next;photoJobs.clear();resetJobSearch();feedback={};save();go(state.currentTask||'life');notify('Project restored from your backup.');}catch(err){notify('Could not open backup: '+err.message);}finally{e.target.value='';}});
document.addEventListener('error',e=>{
 if(e.target?.dataset?.networkImage===undefined)return;
 const box=e.target.closest('[data-model-frame]'),key=box?.dataset.modelFrame;
 const car=[...projectCars(),...garage].find(c=>photoKey(c)===key&&!validPhoto(c.photo));
 if(!car||!onlinePhoto(car))return;
 if(state.modelPhotos)delete state.modelPhotos[key];photoJobs.set(key,'error');redrawPhoto(car);save();
},true);
window.addEventListener('online',()=>{for(const [k,v] of photoJobs)if(v==='error')photoJobs.delete(k);queuePhotos();});
window.addEventListener('hashchange',()=>{if(location.hash==='#main')return;const target=route(location.hash.slice(1));page=target;reminder=false;render();});
let beforePrinting=null;
window.addEventListener('beforeprint',()=>{beforePrinting=page;page='report';render();});
window.addEventListener('afterprint',()=>{if(beforePrinting){page=beforePrinting;beforePrinting=null;render();}});
render();
</script></body></html>
